<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务管理器</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>任务管理器</h1>
            <div class="stats" id="stats"></div>
        </header>

        <div class="controls">
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="搜索任务...">
                <button onclick="searchTasks()">搜索</button>
            </div>
            <div class="filter-section">
                <select id="statusFilter">
                    <option value="">所有状态</option>
                    <option value="pending">待处理</option>
                    <option value="in_progress">进行中</option>
                    <option value="completed">已完成</option>
                </select>
                <select id="priorityFilter">
                    <option value="">所有优先级</option>
                    <option value="high">高</option>
                    <option value="medium">中</option>
                    <option value="low">低</option>
                </select>
                <select id="sortBy">
                    <option value="">排序方式</option>
                    <option value="created_at">创建时间</option>
                    <option value="due_date">截止日期</option>
                    <option value="priority">优先级</option>
                </select>
                <button onclick="loadTasks()">刷新</button>
            </div>
            <div class="actions">
                <button onclick="showCreateForm()" class="btn-primary">新建任务</button>
                <button onclick="batchDelete()" class="btn-danger">批量删除</button>
                <button onclick="batchUpdateStatus()" class="btn-secondary">批量更新状态</button>
            </div>
        </div>

        <div class="task-form" id="taskForm" style="display: none;">
            <h2 id="formTitle">新建任务</h2>
            <form id="taskFormElement" onsubmit="saveTask(event)">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label>标题*</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="taskDescription"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>状态</label>
                        <select id="taskStatus">
                            <option value="pending">待处理</option>
                            <option value="in_progress">进行中</option>
                            <option value="completed">已完成</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>优先级</label>
                        <select id="taskPriority">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>截止日期</label>
                        <input type="datetime-local" id="taskDueDate">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">保存</button>
                    <button type="button" onclick="hideForm()" class="btn-secondary">取消</button>
                </div>
            </form>
        </div>

        <div class="tasks-section">
            <h2>任务列表</h2>
            <div id="tasksList"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
